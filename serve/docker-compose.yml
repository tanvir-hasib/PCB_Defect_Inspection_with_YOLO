services:
  api:
    build: .
    image: pcb-aoi-api:latest
    container_name: pcb-aoi-api
    ports:
      - "8000:8000"
    environment:
      BACKEND: ${BACKEND:-trt}            # trt | ort-cuda | ort-cpu
      PRECISION: ${PRECISION:-fp16}       # int8 | fp16 | fp32
      # CONF: "0.35"                      # optional override of the validated operating threshold
      # If the container lands on the wrong GPU under WSL2, also set:
      # CUDA_DEVICE_ORDER: PCI_BUS_ID
      # CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ../artifacts/deploy/pcb:/models:ro   # written by the notebook (Step 8)
      - engine-cache:/cache                  # TensorRT engines survive restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]   # nvidia-smi index
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  engine-cache:
